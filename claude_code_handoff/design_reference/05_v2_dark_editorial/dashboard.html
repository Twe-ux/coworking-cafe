<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace membre — CoworKing Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  /* Dashboard-specific overrides */
  body { background: var(--cream); }

  .dash-shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }
  .dash-sidebar {
    background: var(--body);
    color: #fff;
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .dash-side-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 22px; border-bottom: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 16px;
  }
  .dash-side-logo-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--btn);
    display: flex; align-items: center; justify-content: center;
  }
  .dash-side-link {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: 12px;
    font-size: 14px; font-weight: 500;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    transition: all .15s;
    border: 1px solid transparent;
  }
  .dash-side-link:hover {
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.9);
  }
  .dash-side-link.active {
    background: rgba(242,211,129,0.1);
    color: var(--btn);
    border-color: rgba(242,211,129,0.22);
  }
  .dash-side-section {
    font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.35);
    padding: 18px 14px 8px;
    font-family: 'JetBrains Mono', monospace;
  }
  .dash-side-foot {
    margin-top: auto; padding: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 12px;
  }
  .dash-side-foot-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--main), #5A938B);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; color: #fff; font-size: 16px;
  }

  .dash-main {
    padding: clamp(24px, 3vw, 40px);
    max-width: 1400px;
    width: 100%;
  }
  .dash-topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 34px; gap: 20px;
    flex-wrap: wrap;
  }
  .dash-topbar h1 { font-family: 'Fraunces', serif; font-size: clamp(30px, 3.5vw, 44px); letter-spacing: -0.02em; color: var(--body); line-height: 1.1; }
  .dash-topbar .num { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: var(--gry); margin-bottom: 10px; text-transform: uppercase; }

  .dash-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
  }
  .dash-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: clamp(20px, 2.4vw, 30px);
  }
  .dash-card-dark {
    background: var(--body);
    color: #fff;
    border: none;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
  }
  .stat-card .tag { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: var(--gry); text-transform: uppercase; }
  .stat-card .val { font-family: 'Fraunces', serif; font-size: clamp(28px, 3vw, 38px); color: var(--body); line-height: 1; margin: 10px 0 6px; }
  .stat-card .delta { font-size: 12px; color: var(--main); display: flex; align-items: center; gap: 4px; }

  /* Mobile menu */
  .dash-mobile-topbar {
    display: none;
    align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--body); color: #fff;
    position: sticky; top: 0; z-index: 100;
  }
  .dash-sidebar-scrim { display: none; }

  @media (max-width: 960px) {
    .dash-shell { grid-template-columns: 1fr; }
    .dash-sidebar {
      position: fixed; left: -280px; width: 260px; z-index: 200;
      transition: left .24s ease;
    }
    .dash-sidebar.open { left: 0; }
      .dash-sidebar.open ~ .dash-sidebar-scrim {
      display: block; position: fixed; inset: 0; z-index: 150;
      background: rgba(0,0,0,0.4);
    }
    .dash-mobile-topbar { display: flex; }
    .dash-grid { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel">
const { useState } = React;

const SIDE_NAV = [
  { section: 'Tableau de bord', items: [
    { k: 'home', i: 'home', label: 'Vue d\'ensemble' },
    { k: 'bookings', i: 'calendar', label: 'Mes réservations', badge: 3 },
    { k: 'history', i: 'clock', label: 'Historique' },
  ]},
  { section: 'Mon compte', items: [
    { k: 'wallet', i: 'wallet', label: 'Crédits & facturation' },
    { k: 'loyalty', i: 'sparkle', label: 'Fidélité' },
    { k: 'profile', i: 'user', label: 'Profil' },
  ]},
  { section: 'Communauté', items: [
    { k: 'events', i: 'ticket', label: 'Événements' },
    { k: 'directory', i: 'people', label: 'Annuaire membres' },
  ]},
];

const BOOKINGS = [
  { d: '28', m: 'AVR', day: 'LUN', t: 'Journée · Open-space', time: '9h → 19h', loc: 'Table libre', status: 'confirmé', c: '#417972' },
  { d: '30', m: 'AVR', day: 'MER', t: 'Salle Verrière · 2h', time: '14h → 16h', loc: '4 participants', status: 'confirmé', c: '#5A938B' },
  { d: '06', m: 'MAI', day: 'LUN', t: 'Atelier · Freelance & impôts', time: '19h → 21h', loc: 'Inscrit', status: 'à venir', c: '#8A6B1F' },
];

const ACTIVITY = [
  { d: 'Hier · 18h32', t: 'Réservation confirmée', sub: 'Salle Verrière · 30 avril 14h–16h', i: 'check', c: 'var(--main)' },
  { d: 'Hier · 12h10', t: '+50 points fidélité', sub: 'Journée complète en open-space', i: 'sparkle', c: 'var(--btn-dark)' },
  { d: 'Il y a 3j', t: 'Facture #2026-0412', sub: '179€ · Abonnement Mensuel · Réglée', i: 'receipt', c: 'var(--main)' },
  { d: 'Il y a 5j', t: 'Nouveau membre dans la communauté', sub: 'Camille R. · Designer UX', i: 'user', c: '#5A938B' },
];

function DashIcon({ name, size = 18, stroke = 'currentColor', sw = 1.8 }) {
  return <Icon name={name} size={size} stroke={stroke} sw={sw}/>;
}

function Sidebar({ active, setActive, open, setOpen }) {
  return (
    <>
      <aside className={`dash-sidebar ${open ? 'open' : ''}`}>
        <div className="dash-side-logo">
          <div className="dash-side-logo-mark">
            <DashIcon name="building" size={18} stroke="#1A1A1A"/>
          </div>
          <div>
            <div className="serif" style={{ fontSize: 15 }}>CoworKing Café</div>
            <div className="mono" style={{ fontSize: 9.5, letterSpacing: '0.14em', color: 'rgba(255,255,255,0.45)' }}>ESPACE MEMBRE</div>
          </div>
        </div>

        {SIDE_NAV.map(grp => (
          <div key={grp.section}>
            <div className="dash-side-section">— {grp.section}</div>
            {grp.items.map(it => (
              <div key={it.k} className={`dash-side-link ${active === it.k ? 'active' : ''}`} onClick={() => { setActive(it.k); setOpen(false); }}>
                <DashIcon name={it.i} size={17} stroke={active === it.k ? 'var(--btn)' : 'currentColor'}/>
                <span style={{ flex: 1 }}>{it.label}</span>
                {it.badge && <span style={{ background: 'var(--main)', color: '#fff', fontSize: 10, padding: '2px 7px', borderRadius: 8, fontWeight: 500 }}>{it.badge}</span>}
              </div>
            ))}
          </div>
        ))}

        <div className="dash-side-foot">
          <div className="dash-side-foot-avatar">M</div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, fontWeight: 500, color: '#fff' }}>Marie Dupont</div>
            <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.5)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>Plan Mensuel · 2 ans</div>
          </div>
          <DashIcon name="chevRight" size={14} stroke="rgba(255,255,255,0.4)"/>
        </div>
      </aside>
      <div className="dash-sidebar-scrim" onClick={() => setOpen(false)}/>
    </>
  );
}

function StatCard({ tag, val, delta, deltaPos, unit }) {
  return (
    <div className="stat-card">
      <div className="tag">— {tag}</div>
      <div className="val">{val}<span style={{ fontSize: 14, color: 'var(--gry)', fontFamily: 'Inter', fontWeight: 400, marginLeft: 4 }}>{unit}</span></div>
      <div className="delta" style={{ color: deltaPos ? 'var(--main)' : 'var(--danger)' }}>
        <DashIcon name={deltaPos ? 'arrowUp' : 'arrowDown'} size={12} stroke="currentColor" sw={2.2}/>{delta}
      </div>
    </div>
  );
}

function BookingRow({ b }) {
  return (
    <div style={{ display: 'flex', gap: 16, alignItems: 'center', padding: '16px 0', borderBottom: '1px solid var(--line)' }}>
      <div style={{ width: 56, textAlign: 'center', padding: '10px 4px', background: b.c, color: '#fff', borderRadius: 12, flexShrink: 0 }}>
        <div className="mono" style={{ fontSize: 9, letterSpacing: '0.12em', opacity: 0.85 }}>{b.day}</div>
        <div className="serif" style={{ fontSize: 22, lineHeight: 1, margin: '2px 0' }}>{b.d}</div>
        <div className="mono" style={{ fontSize: 9, letterSpacing: '0.12em', opacity: 0.85 }}>{b.m}</div>
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div className="serif" style={{ fontSize: 16, color: 'var(--body)' }}>{b.t}</div>
        <div style={{ fontSize: 12.5, color: 'var(--gry)', marginTop: 4, display: 'flex', gap: 14, flexWrap: 'wrap' }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><DashIcon name="clock" size={11} stroke="var(--gry)"/>{b.time}</span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><DashIcon name="pin" size={11} stroke="var(--gry)"/>{b.loc}</span>
        </div>
      </div>
      <span className="chip" style={{ background: b.status === 'confirmé' ? 'rgba(65,121,114,0.1)' : 'rgba(242,211,129,0.22)', color: b.status === 'confirmé' ? 'var(--main)' : 'var(--btn-dark)', fontSize: 11 }}>
        {b.status}
      </span>
    </div>
  );
}

function Dashboard() {
  const [active, setActive] = useState('home');
  const [menuOpen, setMenuOpen] = useState(false);

  return (
    <div className="dash-shell">
      <Sidebar active={active} setActive={setActive} open={menuOpen} setOpen={setMenuOpen}/>

      <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0 }}>
        {/* Mobile topbar */}
        <div className="dash-mobile-topbar">
          <button onClick={() => setMenuOpen(true)} style={{ background: 'transparent', border: 'none', color: '#fff', cursor: 'pointer', padding: 4 }}>
            <DashIcon name="menu" size={22} stroke="#fff"/>
          </button>
          <div className="serif" style={{ fontSize: 17 }}>Espace membre</div>
          <div style={{ width: 30 }}/>
        </div>

        <main className="dash-main">
          {/* Topbar */}
          <div className="dash-topbar">
            <div>
              <div className="num">— 01 · Tableau de bord</div>
              <h1>Bonjour Marie, <em style={{ color: 'var(--main)', fontStyle: 'italic' }}>journée productive ?</em></h1>
            </div>
            <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
              <button style={{ width: 42, height: 42, border: '1px solid var(--line)', background: '#fff', borderRadius: 12, cursor: 'pointer', position: 'relative' }}>
                <DashIcon name="bell" size={17} stroke="var(--body)"/>
                <span style={{ position: 'absolute', top: 8, right: 8, width: 8, height: 8, borderRadius: 4, background: 'var(--danger)' }}/>
              </button>
              <a href="booking.html" style={{ textDecoration: 'none' }}>
                <button style={{ background: 'var(--btn)', color: 'var(--body)', padding: '12px 20px', border: 'none', borderRadius: 100, fontSize: 13.5, fontWeight: 500, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8, fontFamily: 'inherit' }}>
                  <DashIcon name="plus" size={14} stroke="#1A1A1A" sw={2.5}/>Nouvelle réservation
                </button>
              </a>
            </div>
          </div>

          {/* Stats row */}
          <div className="stat-grid">
            <StatCard tag="Heures ce mois" val="62" unit="h" delta="+12% vs avril" deltaPos/>
            <StatCard tag="Crédit restant" val="18" unit="h" delta="Renouvellement le 01/05" deltaPos/>
            <StatCard tag="Points fidélité" val="1 240" delta="+180 ce mois" deltaPos/>
            <StatCard tag="Événements" val="2" unit="inscrits" delta="Prochain le 06/05" deltaPos/>
          </div>

          {/* Main grid */}
          <div className="dash-grid">
            <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
              {/* Prochaines réservations */}
              <div className="dash-card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
                  <div>
                    <div className="mono" style={{ fontSize: 10.5, letterSpacing: '0.14em', color: 'var(--gry)', textTransform: 'uppercase' }}>— Prochaines réservations</div>
                    <h2 className="serif" style={{ fontSize: 22, marginTop: 6, color: 'var(--body)' }}>Cette semaine</h2>
                  </div>
                  <a href="#" style={{ fontSize: 12.5, color: 'var(--main)', fontFamily: 'JetBrains Mono', letterSpacing: '0.12em', textTransform: 'uppercase' }}>Tout voir →</a>
                </div>
                {BOOKINGS.map(b => <BookingRow key={b.d + b.m} b={b}/>)}
              </div>

              {/* Activité */}
              <div className="dash-card">
                <div className="mono" style={{ fontSize: 10.5, letterSpacing: '0.14em', color: 'var(--gry)', textTransform: 'uppercase', marginBottom: 6 }}>— Activité récente</div>
                <h2 className="serif" style={{ fontSize: 22, marginBottom: 18, color: 'var(--body)' }}>Ce qui s'est passé</h2>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                  {ACTIVITY.map((a, i) => (
                    <div key={i} style={{ display: 'flex', gap: 14, padding: '14px 0', borderBottom: i < ACTIVITY.length - 1 ? '1px solid var(--line)' : 'none' }}>
                      <div style={{ width: 34, height: 34, borderRadius: 10, background: `color-mix(in srgb, ${a.c} 15%, transparent)`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                        <DashIcon name={a.i} size={15} stroke={a.c} sw={2.2}/>
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 13.5, color: 'var(--body)', fontWeight: 500 }}>{a.t}</div>
                        <div style={{ fontSize: 12, color: 'var(--gry)', marginTop: 2 }}>{a.sub}</div>
                      </div>
                      <div className="mono" style={{ fontSize: 10.5, color: 'var(--gry)', letterSpacing: '0.1em' }}>{a.d}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Right column */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
              {/* Loyalty card */}
              <div className="dash-card dash-card-dark" style={{ position: 'relative', overflow: 'hidden' }}>
                <div style={{ position: 'absolute', top: -40, right: -40, width: 180, height: 180, borderRadius: '50%', background: 'rgba(242,211,129,0.08)' }}/>
                <div className="mono" style={{ fontSize: 10.5, letterSpacing: '0.14em', color: 'var(--btn)', textTransform: 'uppercase' }}>— Fidélité</div>
                <div className="serif" style={{ fontSize: 54, color: 'var(--btn)', lineHeight: 1, marginTop: 10 }}>1 240<span style={{ fontSize: 18, opacity: 0.6 }}>pts</span></div>
                <div style={{ fontSize: 13, opacity: 0.75, marginTop: 10 }}>Plus que <strong style={{ color: 'var(--btn)' }}>260 points</strong> avant le palier <strong>Ambassadeur</strong>.</div>

                <div style={{ marginTop: 20, background: 'rgba(255,255,255,0.08)', height: 6, borderRadius: 3, overflow: 'hidden' }}>
                  <div style={{ width: '82%', height: '100%', background: 'var(--btn)', borderRadius: 3 }}/>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontSize: 11, opacity: 0.6, fontFamily: 'JetBrains Mono' }}>
                  <span>Régulier</span><span>82%</span><span>Ambassadeur</span>
                </div>

                <button style={{ marginTop: 20, width: '100%', background: 'var(--btn)', color: 'var(--body)', border: 'none', borderRadius: 100, padding: '12px 18px', fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit' }}>
                  Voir les récompenses →
                </button>
              </div>

              {/* Quick actions */}
              <div className="dash-card">
                <div className="mono" style={{ fontSize: 10.5, letterSpacing: '0.14em', color: 'var(--gry)', textTransform: 'uppercase', marginBottom: 6 }}>— Raccourcis</div>
                <h3 className="serif" style={{ fontSize: 20, marginBottom: 16, color: 'var(--body)' }}>Actions rapides</h3>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                  {[
                    { i: 'calendar', l: 'Réserver un espace', href: 'booking.html' },
                    { i: 'receipt', l: 'Mes factures' },
                    { i: 'people', l: 'Inviter un ami' },
                    { i: 'help', l: 'Aide & support' },
                  ].map(a => (
                    <a key={a.l} href={a.href || '#'} style={{ textDecoration: 'none' }}>
                      <div style={{ padding: 16, borderRadius: 14, border: '1px solid var(--line)', display: 'flex', flexDirection: 'column', gap: 10, cursor: 'pointer', background: '#fff', transition: 'border-color .15s' }}
                        onMouseEnter={e => e.currentTarget.style.borderColor = 'var(--main)'}
                        onMouseLeave={e => e.currentTarget.style.borderColor = 'var(--line)'}>
                        <div style={{ width: 32, height: 32, borderRadius: 9, background: 'rgba(65,121,114,0.08)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                          <DashIcon name={a.i} size={15} stroke="var(--main)"/>
                        </div>
                        <div style={{ fontSize: 12.5, color: 'var(--body)', fontWeight: 500 }}>{a.l}</div>
                      </div>
                    </a>
                  ))}
                </div>
              </div>

              {/* Next event */}
              <div className="dash-card" style={{ background: 'var(--cream)' }}>
                <div className="mono" style={{ fontSize: 10.5, letterSpacing: '0.14em', color: 'var(--main)', textTransform: 'uppercase' }}>— À ne pas manquer</div>
                <div className="serif" style={{ fontSize: 18, marginTop: 10, color: 'var(--body)', lineHeight: 1.3 }}>Atelier · Freelance & impôts</div>
                <div style={{ fontSize: 12.5, color: 'var(--gry)', marginTop: 6, display: 'flex', gap: 12 }}>
                  <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><DashIcon name="calendar" size={11}/>Lun 06/05</span>
                  <span style={{ display: 'flex', alignItems: 'center', gap: 4 }}><DashIcon name="clock" size={11}/>19h–21h</span>
                </div>
                <div style={{ marginTop: 14, padding: 10, background: '#fff', borderRadius: 10, fontSize: 11.5, color: 'var(--gry)', border: '1px solid var(--line)' }}>
                  <DashIcon name="check" size={11} stroke="var(--main)" sw={2.5}/> Vous êtes inscrit · Confirmation envoyée par email
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard/>);
</script>
</body>
</html>
